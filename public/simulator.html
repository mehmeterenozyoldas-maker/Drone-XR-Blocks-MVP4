            });

          grid.addRow({ weight: 0.06 });

          const btnRow = grid.addRow({ weight: 0.18 });
          this.btnScan = btnRow.addCol({ weight: 1.0 }).addTextButton({
            text: '[ SPATIAL SCAN ]',
            fontSize: 0.05,
            backgroundColor: '#ff3b00',
            fontColor: '#ffffff',
          });
          this.btnScan.onTriggered = () => this.triggerScan();

          grid.addRow({ weight: 0.06 });

          this.aiAnalysisText = grid
            .addRow({ weight: 0.17 })
            .addText({
              text: 'WAITING FOR SCAN DATA...',
              fontColor: '#757570',
              fontSize: 0.035,
            });

          this.copilot.onStatusChange = (status) => {
            this.aiAnalysisText.setText("CO-PILOT: " + status);
          };

          this.scannerPanel.updateLayouts();
        }

        triggerHaptic(intensity, duration) {
          const session = xb.core.renderer?.xr?.getSession();
          if (session) {
            for (const source of session.inputSources) {
              if (
                source.gamepad &&
                source.gamepad.hapticActuators?.length > 0
              ) {
                source.gamepad.hapticActuators[0].pulse(intensity, duration);
              }
            }
          }
        }

        async triggerScan() {
          if (this.isScanning) return;
          this.isScanning = true;
          this.scanCone.visible = true;
          this.scanStatusText.setText("STATUS: SCANNING ENVIRONMENT...");
          this.aiAnalysisText.setText("LLM: CAPTURING OPTICAL DATA...");

          const [base64Image] = await Promise.all([
            this.captureCameraFrame(),
            new Promise((r) => setTimeout(r, 600)),
          ]);

          this.scanCone.visible = false;
          this.isScanning = false;

          const raycaster = new THREE.Raycaster();
          const worldPos = new THREE.Vector3();
          const worldDir = new THREE.Vector3();
          this.fpvCamera.getWorldPosition(worldPos);
          this.fpvCamera.getWorldDirection(worldDir);
          raycaster.set(worldPos, worldDir);

          const intersects = raycaster.intersectObjects(
            this.activeTargets,
            true,
          );
          let distance = 5.0;

          if (intersects.length > 0) {
            this.scanStatusText.setText("STATUS: TARGET LOCKED");
            this.triggerHaptic(0.8, 100);
            distance = intersects[0].distance;
          } else {
            this.scanStatusText.setText("STATUS: SCAN COMPLETE");
            this.triggerHaptic(0.4, 50);
          }

          this.analyzeWithAI(base64Image, distance);
        }

        async analyzeWithAI(base64Image, distance) {
          this.aiAnalysisText.setText("LLM: GENERATING SPATIAL READOUT...");
          try {
            const res = await fetch("/api/scan", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ image: base64Image, distance }),
            });

            if (!res.ok) {
              throw new Error(`HTTP error! status: ${res.status}`);
            }

            const data = await res.json();
            this.aiAnalysisText.setText(`LLM READOUT:\n${data.text}`);
          } catch (e) {
            console.error("Analysis Error:", e);
            this.aiAnalysisText.setText(
              "LLM OFFLINE. EXTREME RADIATION SUSPECTED.",
            );
          }
        }

        fireLaser() {
          if (this.time - this.lastFireTime < 0.2) return;
          this.lastFireTime = this.time;

          this.synth.playLaser();
          this.triggerHaptic(0.5, 30);

          const poolItem = this.laserPool.find((p) => !p.active);
          if (poolItem) {
            const firePos = new THREE.Vector3();
            this.gimbalGroup.getWorldPosition(firePos);
            const forwardOffset = new THREE.Vector3(0, 0, -0.2).applyQuaternion(
              this.drone.quaternion,
            );

            poolItem.mesh.position.copy(firePos).add(forwardOffset);
            poolItem.mesh.quaternion.copy(this.drone.quaternion);
            poolItem.velocity = new THREE.Vector3(0, 0, -1)
              .applyQuaternion(this.drone.quaternion)
              .multiplyScalar(10)
              .add(this.velocity);

            poolItem.active = true;
            poolItem.age = 0;
            poolItem.mesh.visible = true;
          }
        }

        detectPinch(joints) {
          if (!joints || !joints["thumb-tip"] || !joints["index-finger-tip"])
            return false;
          const thumb = joints["thumb-tip"].position;
          const index = joints["index-finger-tip"].position;
          return thumb.distanceTo(index) < 0.015;
        }

        getInputs(dt) {
          let target = { throttle: 0, yaw: 0, pitch: 0, roll: 0 };

          if (this.keys.w) target.throttle += 1;
          if (this.keys.s) target.throttle -= 1;
          if (this.keys.a) target.yaw += 1;
          if (this.keys.d) target.yaw -= 1;
          if (this.keys.up) target.pitch += 1;
          if (this.keys.down) target.pitch -= 1;
          if (this.keys.left) target.roll -= 1;
          if (this.keys.right) target.roll += 1;

          const applyExpo = (val, deadzone = 0.05, power = 2.0) => {
            const abs = Math.abs(val);
            if (abs < deadzone) return 0;
            return (
              Math.sign(val) *
              Math.pow((abs - deadzone) / (1.0 - deadzone), power)
            );
          };

          const session = xb.core.renderer.xr.getSession();
          this.gestureL = "NONE";
          this.gestureR = "NONE";

          let leftJoints = null;
          let rightJoints = null;

          if (session) {
            for (const source of session.inputSources) {
              if (source.gamepad) {
                const buttons = source.gamepad.buttons;
                if (!source.gamepad.userData)
                  source.gamepad.userData = {
                    btn4Pressed: false,
                    btn5Pressed: false,
                  };

                if (source.handedness === "left") {
                  if (buttons[4] && buttons[4].pressed) {
                    if (!source.gamepad.userData.btn4Pressed) {
                      source.gamepad.userData.btn4Pressed = true;
                      this.triggerScan();
                    }
                  } else source.gamepad.userData.btn4Pressed = false;

                  if (buttons[5] && buttons[5].pressed) {
                    if (!source.gamepad.userData.btn5Pressed) {
                      source.gamepad.userData.btn5Pressed = true;
                      this.toggleHUD();
                    }
                  } else source.gamepad.userData.btn5Pressed = false;
                }

                if (source.handedness === "right") {
                  if (buttons[4] && buttons[4].pressed) {
                    if (!source.gamepad.userData.btn4Pressed) {
                      source.gamepad.userData.btn4Pressed = true;
                      this.fireLaser();
                    }
                  } else source.gamepad.userData.btn4Pressed = false;

                  if (buttons[5] && buttons[5].pressed) {
                    if (!source.gamepad.userData.btn5Pressed) {
                      source.gamepad.userData.btn5Pressed = true;
                      this.togglePCAFeed();
                    }
                  } else source.gamepad.userData.btn5Pressed = false;
                }
              }

              if (
                source.gamepad &&
                source.gamepad.axes.length >= 4 &&
                !source.hand
              ) {
                if (source.handedness === "left") {
                  target.yaw = applyExpo(-source.gamepad.axes[2]);
                  target.throttle = applyExpo(-source.gamepad.axes[3]);
                } else if (source.handedness === "right") {
                  target.roll = applyExpo(source.gamepad.axes[2]);
                  target.pitch = applyExpo(-source.gamepad.axes[3]);
                }
              }
            }

            if (xb.user.hands?.hands) {
              let handIndex = 0;
              for (const source of session.inputSources) {
                if (source.hand) {
                  const h = xb.user.hands.hands[handIndex];
                  if (h && h.joints) {
                    if (source.handedness === "left") leftJoints = h.joints;
                    else if (source.handedness === "right")
                      rightJoints = h.joints;
                  }
                  handIndex++;
                }
              }
            }
          } else if (xb.user.hands?.hands) {
            leftJoints = xb.user.hands.hands[0]?.joints;
            rightJoints = xb.user.hands.hands[1]?.joints;
          }

          if (leftJoints && this.detectPinch(leftJoints)) {
            const currentPos = leftJoints["index-finger-tip"].position;
            if (!this.leftPinchOrigin) {
              this.leftPinchOrigin = currentPos.clone();
              this.triggerHaptic(0.3, 20);
              if (!this.audioStarted) {
                this.resumeAudio();
              }
            } else {
              const deltaY = currentPos.y - this.leftPinchOrigin.y;
              const deltaX = currentPos.x - this.leftPinchOrigin.x;
              target.throttle = deltaY * this.joystickSensitivity;
              target.yaw = -deltaX * this.joystickSensitivity;
            }
            this.gestureL = "RC STICK";
            if (this.leftJoySphere && this.leftJoyTip && this.leftJoyLine) {
              this.leftJoySphere.position.copy(this.leftPinchOrigin);
              this.leftJoyTip.position.copy(currentPos);
              this.leftJoySphere.visible = true;
              this.leftJoyTip.visible = true;
              const posAttr = this.leftJoyLine.geometry.attributes.position;
              posAttr.setXYZ(
                0,
                this.leftPinchOrigin.x,
                this.leftPinchOrigin.y,
                this.leftPinchOrigin.z,
              );
              posAttr.setXYZ(1, currentPos.x, currentPos.y, currentPos.z);
              posAttr.needsUpdate = true;
              this.leftJoyLine.visible = true;
            }
          } else {
            this.leftPinchOrigin = null;
            this.gestureL = "RELEASED";
            if (this.leftJoySphere) {
              this.leftJoySphere.visible = false;
              this.leftJoyTip.visible = false;
              this.leftJoyLine.visible = false;
            }
          }

          if (rightJoints && this.detectPinch(rightJoints)) {
            const currentPos = rightJoints["index-finger-tip"].position;
            if (!this.rightPinchOrigin) {
              this.rightPinchOrigin = currentPos.clone();
              this.droneStartPos.copy(this.drone.position);
              this.triggerHaptic(0.3, 20);
              if (!this.audioStarted) {
                this.resumeAudio();
              }
            }

            if (this.flightMode === "KINETIC") {
              this.kineticActive = true;
              const delta = currentPos.clone().sub(this.rightPinchOrigin);
              this.kineticTarget
                .copy(this.droneStartPos)
                .add(delta.multiplyScalar(4.0));
              this.gestureR = "TELEKINESIS";

              if (this.rightJoySphere && this.rightJoyLine) {
                this.rightJoySphere.position.copy(this.rightPinchOrigin);
                this.rightJoySphere.visible = true;
                const posAttr = this.rightJoyLine.geometry.attributes.position;
                posAttr.setXYZ(
                  0,
                  this.rightPinchOrigin.x,
                  this.rightPinchOrigin.y,
                  this.rightPinchOrigin.z,
                );
                posAttr.setXYZ(1, currentPos.x, currentPos.y, currentPos.z);
                posAttr.needsUpdate = true;
                this.rightJoyLine.visible = true;
              }
            } else {
              this.kineticActive = false;
              const deltaZ = currentPos.z - this.rightPinchOrigin.z;
              const deltaX = currentPos.x - this.rightPinchOrigin.x;
              target.pitch = deltaZ * this.joystickSensitivity;
              target.roll = deltaX * this.joystickSensitivity;
              this.gestureR = "RC STICK";
              if (
                this.rightJoySphere &&
                this.rightJoyTip &&
                this.rightJoyLine
              ) {
                this.rightJoySphere.position.copy(this.rightPinchOrigin);
                this.rightJoyTip.position.copy(currentPos);
                this.rightJoySphere.visible = true;
                this.rightJoyTip.visible = true;
                const posAttr = this.rightJoyLine.geometry.attributes.position;
                posAttr.setXYZ(
                  0,
                  this.rightPinchOrigin.x,
                  this.rightPinchOrigin.y,
                  this.rightPinchOrigin.z,
                );
                posAttr.setXYZ(1, currentPos.x, currentPos.y, currentPos.z);
                posAttr.needsUpdate = true;
                this.rightJoyLine.visible = true;
              }
            }
          } else {
            this.rightPinchOrigin = null;
            this.gestureR = "RELEASED";
            this.kineticActive = false;
            if (this.rightJoySphere) {
              this.rightJoySphere.visible = false;
              this.rightJoyTip.visible = false;
              this.rightJoyLine.visible = false;
            }
          }

          target.throttle = THREE.MathUtils.clamp(target.throttle, -1, 1);
          target.yaw = THREE.MathUtils.clamp(target.yaw, -1, 1);
          target.pitch = THREE.MathUtils.clamp(target.pitch, -1, 1);
          target.roll = THREE.MathUtils.clamp(target.roll, -1, 1);

          const lerpSpeed = 4.0;
          this.smoothedInputs.throttle = THREE.MathUtils.lerp(
            this.smoothedInputs.throttle,
            target.throttle,
            dt * lerpSpeed,
          );
          this.smoothedInputs.yaw = THREE.MathUtils.lerp(
            this.smoothedInputs.yaw,
            target.yaw,
            dt * lerpSpeed,
          );
          this.smoothedInputs.pitch = THREE.MathUtils.lerp(
            this.smoothedInputs.pitch,
            target.pitch,
            dt * lerpSpeed,
          );
          this.smoothedInputs.roll = THREE.MathUtils.lerp(
            this.smoothedInputs.roll,
            target.roll,
            dt * lerpSpeed,
          );

          if (Math.abs(this.smoothedInputs.throttle) < 0.01)
            this.smoothedInputs.throttle = 0;
          if (Math.abs(this.smoothedInputs.yaw) < 0.01)
            this.smoothedInputs.yaw = 0;
          if (Math.abs(this.smoothedInputs.pitch) < 0.01)
            this.smoothedInputs.pitch = 0;
          if (Math.abs(this.smoothedInputs.roll) < 0.01)
            this.smoothedInputs.roll = 0;

          return { inputs: this.smoothedInputs, leftJoints, rightJoints };
        }

        setupKeyboardControls() {
          window.addEventListener("mousedown", () => {
            if (!this.audioStarted) {
               this.resumeAudio();
            }
          });
          window.addEventListener(
            "keydown",
            (e) => {
              this.handleKey(e, true);
              if (!this.audioStarted) {
                this.resumeAudio();
              }
            },
            { passive: false },
          );
          window.addEventListener("keyup", (e) => this.handleKey(e, false), {
            passive: false,
          });
        }

        handleKey(e, isDown) {
          if (
            [
              "Space",
              "ArrowUp",
              "ArrowDown",
              "ArrowLeft",
              "ArrowRight",
            ].includes(e.code)
          )
            e.preventDefault();

          switch (e.code) {
            case "KeyW":
              this.keys.w = isDown;
              break;
            case "KeyS":
              this.keys.s = isDown;
              break;
            case "KeyA":
              this.keys.a = isDown;
              break;
            case "KeyD":
              this.keys.d = isDown;
              break;
            case "ArrowUp":
              this.keys.up = isDown;
              break;
            case "ArrowDown":
              this.keys.down = isDown;
              break;
            case "ArrowLeft":
              this.keys.left = isDown;
              break;
            case "ArrowRight":
              this.keys.right = isDown;
              break;
            case "KeyC":
              if (isDown) this.triggerScan();
              break;
            case "KeyP":
              if (isDown) this.togglePCAFeed();
              break;
            case "KeyH":
              if (isDown) this.toggleHUD();
              break;
            case "KeyR":
              if (isDown) this.recallDrone();
              break;
            case "KeyM":
              if (isDown && this.vrManager) {
                if (this.vrManager.activeWorld === 'temple') {
                  this.vrManager.exitWorld();
                } else {
                  this.vrManager.enterWorld('temple');
                }
              }
              break;
            case "KeyN":
              if (isDown && this.vrManager) {
                if (this.vrManager.activeWorld === 'greek') {
                  this.vrManager.exitWorld();
                } else {
                  this.vrManager.enterWorld('greek');
                }
              }
              break;
            case "Space":
              if (isDown) this.fireLaser();
              break;
          }
        }

        updateWristInteraction(leftJoints, rightJoints, dt) {
          if (!this.wristGroup) return;

          if (leftJoints && leftJoints["wrist"]) {
            const wristJoint = leftJoints["wrist"];
            this.wristGroup.position.copy(wristJoint.position);
            this.wristGroup.quaternion.copy(wristJoint.quaternion);

            this.wristGroup.translateY(0.04);
            this.wristGroup.translateZ(0.04);

            if (xb.core.camera) {
              const backOfHandNormal = new THREE.Vector3(
                0,
                1,
                0,
              ).applyQuaternion(wristJoint.quaternion);
              const camToWrist = xb.core.camera.position
                .clone()
                .sub(wristJoint.position)
                .normalize();

              if (backOfHandNormal.dot(camToWrist) > 0.4) {
                this.wristGroup.visible = true;
                this.wristGroup.scale.lerp(new THREE.Vector3(1, 1, 1), dt * 15);
              } else {
                this.wristGroup.scale.lerp(
                  new THREE.Vector3(0.01, 0.01, 0.01),
                  dt * 10,
                );
                if (this.wristGroup.scale.x < 0.05)
                  this.wristGroup.visible = false;
              }
            }

            if (
              this.wristGroup.visible &&
              this.wristGroup.scale.x > 0.8 &&
              rightJoints &&
              rightJoints["index-finger-tip"]
            ) {
              const indexTip = rightJoints["index-finger-tip"].position;

              for (let btn of this.wristButtons) {
                const btnWorldPos = new THREE.Vector3();
                btn.getWorldPosition(btnWorldPos);

                if (
                  indexTip.distanceTo(btnWorldPos) < 0.015 &&
                  this.time - this.lastWristPress > 0.5
                ) {
                  this.lastWristPress = this.time;

                  btn.position.y = btn.userData.baseHeight - 0.004;
                  setTimeout(() => {
                    btn.position.y = btn.userData.baseHeight;
                  }, 150);

                  this.triggerHaptic(0.5, 30);

                  if (btn.userData.action === "toggleHUD") this.toggleHUD();
                  if (btn.userData.action === "togglePCA") this.togglePCAFeed();
                  if (btn.userData.action === "recallDrone") this.recallDrone();
                  if (btn.userData.action === "toggleFlightMode")
                    this.toggleFlightMode();
                  if (btn.userData.action === "toggleCoPilot")
                    this.toggleCoPilot();
                }
              }
            }
          } else {
            this.wristGroup.visible = false;
          }
        }

        updateDynamicUI(dt) {
          if (!xb.core.camera) return;
          const cam = xb.core.camera;
          const distL = this.panel.position.distanceTo(cam.position);

          if (distL > 1.8) {
            const leftOffset = new THREE.Vector3(-0.45, -0.2, -0.6);
            leftOffset.applyQuaternion(cam.quaternion);
            const targetLeft = cam.position.clone().add(leftOffset);
            this.panel.position.lerp(targetLeft, dt * 3);

            const rightOffset = new THREE.Vector3(0.45, -0.2, -0.6);
            rightOffset.applyQuaternion(cam.quaternion);
            const targetRight = cam.position.clone().add(rightOffset);
            this.scannerPanel.position.lerp(targetRight, dt * 3);
          }
        }

        update() {
          let dt = xb.getDeltaTime();
          if (isNaN(dt) || dt <= 0) dt = 0.016;
          dt = Math.min(dt, 0.05);

          this.time += dt;
          this.frameCount++;

          try {
            if (this.vrManager) {
              this.vrManager.update(this.time);
              if (this.drone && this.velocity) {
                this.vrManager.checkIntersections(this.drone.position, this.velocity);
              }
            }
          } catch(e) { console.error("VR Manager tick error", e); }

          if (this.paintballs) {
            this.paintballs.forEach((p) => p.update());
            this.paintballs = this.paintballs.filter((p) => {
              if (p.children.length === 0) {
                this.remove(p);
                if (p.dispose) p.dispose();
                return false;
              }
              return true;
            });
          }

          try {
            if (this.rainParticles) {
              const leftCamera = xb.getXrCameraLeft() || xb.core.camera;
              
              // Constrain clouds horizontally to track viewer cockpit position; rain is handled particle-locally around camera position
              // this.cloud.position.x = leftCamera.position.x;
              // this.cloud.position.z = leftCamera.position.z;

              this.rainParticles.update(leftCamera, xb.core.depth);
              // this.cloud.update(xb.core.camera, xb.core.depth);
            }
          } catch(e) { console.error("Rain particles error", e); }

          if (
            this.currentMode === "AR" &&
            xb.core.renderer &&
            xb.core.renderer.xr.isPresenting
          ) {
            const frame = xb.core.renderer.xr.getFrame();
            if (frame && this.hitTestSource) {
              const refSpace = xb.core.renderer.xr.getReferenceSpace();
              const hits = frame.getHitTestResults(this.hitTestSource);
              if (hits.length > 0) {
                const hit = hits[0];
                const pose = hit.getPose(refSpace);
                if (pose) {
                  this.reticle.visible = true;
                  this.reticle.matrix.fromArray(pose.transform.matrix);

                  const hitPos = new THREE.Vector3().setFromMatrixPosition(
                    this.reticle.matrix,
                  );
                  this.lastHitPos = hitPos;

                  if (hitPos.y < this.trueGroundLevel) {
                    this.trueGroundLevel = hitPos.y;
                  }
                }
              } else {
                this.reticle.visible = false;
              }
            }
          } else {
            if (this.reticle) this.reticle.visible = false;
          }

          const { inputs, leftJoints, rightJoints } = this.getInputs(dt);

          this.updateWristInteraction(leftJoints, rightJoints, dt);
          this.updateDynamicUI(dt);

          const groundLevel =
            this.currentMode === "AR" ? this.trueGroundLevel : 0.1;
          const altitude = Math.max(0, this.drone.position.y - groundLevel);
          const horizontalSpeed = new THREE.Vector2(
            this.velocity.x,
            this.velocity.z,
          ).length();

          // Physics Polish: Realistic idle wobble when hovering
          if (horizontalSpeed < 0.1 && altitude > 0.1) {
            this.drone.position.x += Math.sin(this.time * 3) * 0.002 * dt;
            this.drone.position.z += Math.cos(this.time * 2.5) * 0.002 * dt;
            this.drone.position.y += Math.sin(this.time * 4) * 0.001 * dt;
          }

          if (this.audioStarted) {
            const tiltX = this.drone.rotation.x;
            const tiltZ = this.drone.rotation.z;
            this.synth.updateFlightParams(
              inputs.throttle,
              horizontalSpeed,
              tiltX,
              tiltZ,
              inputs.yaw,
              dt,
            );
            this.synth.updateParams(altitude);
            this.currentBPM = this.synth.bpm;
          }

          this.spawnPropWash(altitude, groundLevel, dt);

          for (let i = this.activeTargets.length - 1; i >= 0; i--) {
            const target = this.activeTargets[i];
            target.rotation.x += 1.0 * dt;
            target.rotation.y += 1.5 * dt;

            if (this.drone) {
              const distToDrone = this.drone.position.distanceTo(target.position);
              if (distToDrone < 0.42) {
                // Drone directly collided with a synth target!
                this.spawnExplosion(target.position, 0xff3b00);
                this.remove(target);
                this.activeTargets.splice(i, 1);

                this.score += 100;
                if (this.scoreText) this.scoreText.setText(`SCR ${this.score}`);
                if (this.audioStarted) {
                  this.synth.playImpact();
                  this.synth.playSuccess();
                }
                this.synth.glitchFactor = Math.min(1.0, this.synth.glitchFactor + 0.35);

                // Spawn 2 new targets when one gets hit
                this.spawnTarget();
                this.spawnTarget();
              }
            }
          }

          // Process Particle Engine
          for (let p of this.particlePool) {
            if (p.active) {
              p.mesh.position.addScaledVector(p.vel, dt);
              p.vel.y -= 9.8 * dt; // Apply gravity to particles
              p.age += dt;
              const scale = Math.max(0, 1 - p.age * 2.0);
              p.mesh.scale.set(scale, scale, scale);
              if (p.age > 0.5) {
                p.active = false;
                p.mesh.visible = false;
              }
            }
          }

          this.laserPool.forEach((poolItem) => {
            if (!poolItem.active) return;

            poolItem.velocity.y -= 9.81 * dt; // Apply gravity for splash ball

            const startPos = poolItem.mesh.position.clone();
            poolItem.mesh.position.addScaledVector(poolItem.velocity, dt);
            const endPos = poolItem.mesh.position.clone();
            poolItem.age += dt;

            let hitOccurred = false;
            let hitPoint = null;
            let hitNormal = null;
            let hitObj = null;
            let hitFace = null;
            let hitTarget = null;

            const dir = endPos.clone().sub(startPos).normalize();
            const dist = startPos.distanceTo(endPos);

            if (dist > 0.001) {
              const raycaster = new THREE.Raycaster(startPos, dir, 0, Math.max(dist, 0.05));

              // 1. Check precise physical hit on active synthesizer targets
              const targetHits = raycaster.intersectObjects(this.activeTargets, true);
              if (targetHits.length > 0) {
                const targetHit = targetHits[0];
                let matchedGroup = targetHit.object;
                while (matchedGroup && matchedGroup.parent !== this && matchedGroup.parent !== xb.core.scene) {
                  matchedGroup = matchedGroup.parent;
                }
                if (matchedGroup && this.activeTargets.includes(matchedGroup)) {
                  hitOccurred = true;
                  hitPoint = targetHit.point;
                  hitNormal = targetHit.face ? targetHit.face.normal : dir.clone().negate();
                  hitObj = targetHit.object;
                  hitFace = targetHit.face;
                  hitTarget = matchedGroup;
                }
              }

              // 2. Fallback check against physical chamber surfaces (purely virtual fast checks)
              if (!hitOccurred) {
                let collidablesToCheck = [...this.collidableSurfaces];
                let allHits = [];
                if (collidablesToCheck.length > 0) {
                  allHits.push(...raycaster.intersectObjects(collidablesToCheck, true));
                }
                
                // Explicitly check depthMesh for real-world geometry collisions in AR
                if (xb.core.depth && xb.core.depth.depthMesh) {
                  const dm = xb.core.depth.depthMesh;
                  if (dm) {
                    const oldVisible = dm.visible;
                    dm.visible = true; // Briefly make visible so Raycaster can see it
                    allHits.push(...raycaster.intersectObject(dm, false));
                    dm.visible = oldVisible;
                  }
                }

                if (allHits.length > 0) {
                  allHits.sort((a, b) => a.distance - b.distance);
                  hitOccurred = true;
                  hitPoint = allHits[0].point;
                  hitNormal = allHits[0].face ? allHits[0].face.normal : dir.clone().negate();
                  hitObj = allHits[0].object;
                  hitFace = allHits[0].face;
                  hitTarget = null;
                }
              }
            }
            
            // 3. Fallback to WebXR Hit Test system explicit plane hit matches
            if (!hitOccurred && this.lastHitPos) {
               if (endPos.distanceTo(this.lastHitPos) < 0.2) {
                 hitOccurred = true;
                 hitPoint = this.lastHitPos.clone();
                 hitNormal = poolItem.velocity.clone().negate().normalize();
               }
            }

            if (hitOccurred) {
              poolItem.active = false;
              poolItem.mesh.visible = false;

              // Handle synthesizer score target destruction first
              if (hitTarget) {
                this.spawnExplosion(hitPoint, poolItem.color);
                this.remove(hitTarget);
                const idx = this.activeTargets.indexOf(hitTarget);
                if (idx > -1) this.activeTargets.splice(idx, 1);
                
                this.score += 100;
                if (this.scoreText) this.scoreText.setText(`SCR ${this.score}`);
                if (this.audioStarted) this.synth.playSuccess();
                this.synth.glitchFactor = Math.min(1.0, this.synth.glitchFactor + 0.35);

                this.spawnTarget();
                this.spawnTarget();
                return;
              }

              // Handle general environmental paint splatting
              if (!this.paintballs) this.paintballs = [];
              try {
                const listener = this.listener || null;
                const paintball = new PaintSplash(
                  listener,
                  poolItem.color || palette.getRandomLiteGColor(),
                );

                let direction = hitNormal.clone();

                if (hitObj && hitObj.quaternion && hitFace) {
                  const worldQuat = hitObj.getWorldQuaternion(new THREE.Quaternion());
                  if (!isNaN(worldQuat.x) && !isNaN(worldQuat.y) && !isNaN(worldQuat.z) && !isNaN(worldQuat.w)) {
                    direction.applyQuaternion(worldQuat);
                    direction.normalize();
                  }
                }

                const srcVec = new THREE.Vector3(0.0, 0.0, -1.0); // decal looks along -Z by default
                if (srcVec.dot(direction) < -0.999) {
                  direction.set(0.001, 0.001, -1.0).normalize();
                }

                const orientation = new THREE.Quaternion().setFromUnitVectors(
                  srcVec,
                  direction,
                );

                const randomRotation = new THREE.Matrix4().makeRotationZ(
                  Math.random() * Math.PI * 2,
                );
                orientation.multiply(
                  new THREE.Quaternion().setFromRotationMatrix(randomRotation),
                );

                if (isNaN(orientation.x) || isNaN(orientation.y) || isNaN(orientation.z) || isNaN(orientation.w) ||
                    !isFinite(orientation.x) || !isFinite(orientation.y) || !isFinite(orientation.z) || !isFinite(orientation.w)) {
                  orientation.set(0, 0, 0, 1);
                }

                const safeHitPoint = hitPoint ? hitPoint.clone() : new THREE.Vector3(0, 0, 0);
                if (isNaN(safeHitPoint.x) || isNaN(safeHitPoint.y) || isNaN(safeHitPoint.z)) {
                  safeHitPoint.set(0, 0, 0);
                }

                // Create high-fidelity splatter, micro-dots, wall dripping streams, and sound effects!
                paintball.splatOnMesh(
                  hitObj,
                  safeHitPoint,
                  orientation,
                  0.20,
                );

                this.add(paintball);
                this.paintballs.push(paintball);
              } catch (e) {
                console.error("Splat error: ", e);
              }
              return;
            }

            if (poolItem.age > 2.0) {
              poolItem.active = false;
              poolItem.mesh.visible = false;
            }
          });

          this.rotors.forEach((r) => {
            let speed = 30;
            if (this.rotorGlitchActive > 0.1) {
              speed = 5 + Math.sin(this.time * 60) * 18; // Fluttering/sputtering rotor speed
            }
            r.rotation.y += speed * r.userData.spinDir * dt;
          });

          const maxTilt = Math.PI / 5.5;

          if (this.flightMode === "KINETIC" && this.kineticActive) {
            const distance = this.kineticTarget.distanceTo(this.drone.position);
            const direction = this.kineticTarget
              .clone()
              .sub(this.drone.position)
              .normalize();

            const SPRING_CONSTANT = 15.0;
            const DAMPING = 5.0;

            const springForce = direction.multiplyScalar(
              distance * SPRING_CONSTANT,
            );
            const dampingForce = this.velocity.clone().multiplyScalar(-DAMPING);

            const totalForce = springForce.add(dampingForce);

            this.velocity.addScaledVector(totalForce, dt);

            this.drone.rotation.x = THREE.MathUtils.lerp(
              this.drone.rotation.x,
              this.velocity.z * 0.15,
              6 * dt,
            );
            this.drone.rotation.z = THREE.MathUtils.lerp(
              this.drone.rotation.z,
              -this.velocity.x * 0.15,
              6 * dt,
            );

            this.velocity.multiplyScalar(Math.pow(0.1, dt)); // Higher drag in kinetic mode
            this.drone.position.addScaledVector(this.velocity, dt);

            // Yaw follows velocity vector slowly
            if (this.velocity.lengthSq() > 0.1) {
              const targetYaw = Math.atan2(-this.velocity.x, -this.velocity.z);
              let diff = targetYaw - this.drone.rotation.y;
              while (diff < -Math.PI) diff += Math.PI * 2;
              while (diff > Math.PI) diff -= Math.PI * 2;
              this.drone.rotation.y += diff * 2.0 * dt;
            }

            if (this.gimbalGroup) {
              this.gimbalGroup.rotation.x = -this.drone.rotation.x;
              this.gimbalGroup.rotation.z = -this.drone.rotation.z;
            }
          } else {
            this.drone.rotation.y -= inputs.yaw * 2.5 * dt;
            this.drone.rotation.x = THREE.MathUtils.lerp(
              this.drone.rotation.x,
              -inputs.pitch * maxTilt,
              6 * dt,
            );
            this.drone.rotation.z = THREE.MathUtils.lerp(
              this.drone.rotation.z,
              -inputs.roll * maxTilt,
              6 * dt,
            );

            if (this.gimbalGroup) {
              this.gimbalGroup.rotation.x = -this.drone.rotation.x;
              this.gimbalGroup.rotation.z = -this.drone.rotation.z;
            }

            const thrust =
              Math.abs(-9.81) /
                Math.max(
                  0.5,
                  Math.cos(this.drone.rotation.x) *
                    Math.cos(this.drone.rotation.z),
                ) +
              inputs.throttle * 20.0;
            const force = new THREE.Vector3(0, thrust, 0).applyEuler(
              this.drone.rotation,
            );
            force.y -= 9.81;
            this.velocity.addScaledVector(force, dt);
            this.velocity.multiplyScalar(Math.pow(0.05, dt));

            if (
              Math.abs(inputs.throttle) < 0.1 &&
              Math.abs(inputs.pitch) < 0.1 &&
              Math.abs(inputs.roll) < 0.1 &&
              this.drone.position.y > groundLevel + 0.1
            ) {
              this.velocity.y += Math.sin(this.time * 5) * 0.02 * dt;
            }
            this.drone.position.addScaledVector(this.velocity, dt);
          }

                    // Random droplets hitting the FPV camera lens
          if (this.currentMode !== 'AR') { // Ensure we are flying
             if (Math.random() < 0.05 * this.velocity.length()) { // More drops when flying fast
                const dropMat = new THREE.MeshBasicMaterial({ color: 0xccffff, transparent: true, opacity: 0.25 });
                const dropScale = Math.random() * 0.003 + 0.001;
                const dropGeo = new THREE.CircleGeometry(dropScale, 12);
                const drop = new THREE.Mesh(dropGeo, dropMat);
                
                // Random position on the 'lens'
                drop.position.set((Math.random() - 0.5) * 0.08, (Math.random() - 0.5) * 0.06, 0);
                drop.userData.vy = -0.01 - Math.random() * 0.02; // Slow drag down
                drop.userData.age = 0;
                
                if (this.lensOverlayGroup) {
                    this.lensOverlayGroup.add(drop);
                    if (!this.lensDrops) this.lensDrops = [];
                    this.lensDrops.push(drop);
                }
             }
             
             if (this.lensDrops) {
                for (let i = this.lensDrops.length - 1; i >= 0; i--) {
                   const d = this.lensDrops[i];
                   d.position.y += d.userData.vy * dt;
                   d.userData.age += dt;
                   d.scale.x = Math.max(0.01, 1.0 - d.userData.age * 0.5); // Shrink horizontal (streak)
                   d.scale.y += dt; // Stretch vertical
                   d.material.opacity -= dt * 0.2;
                   if (d.material.opacity <= 0) {
                      this.lensOverlayGroup.remove(d);
                      this.lensDrops.splice(i, 1);
                   }
                }
             }
          }
          
          // Nanite auto-repairs and glitch decay
          this.systemIntegrity = Math.min(100, this.systemIntegrity + dt * 6.5);
          this.rotorGlitchActive = Math.max(
            0,
            this.rotorGlitchActive - dt * 2.0,
          );

          if (this.drone.position.y <= groundLevel) {
            if (this.velocity.y < -0.8) {
              if (this.audioStarted) this.synth.playImpact();
              this.triggerHaptic(1.0, 200);

              // Trigger crash damage mechanics
              const damage = Math.floor(20 + Math.abs(this.velocity.y) * 15);
              this.systemIntegrity = Math.max(0, this.systemIntegrity - damage);

              this.synth.glitchFactor = 1.0;
              this.rotorGlitchActive = 1.0;

              // Spark impact explosion underneath the drone!
              this.spawnExplosion(this.drone.position);
            }
            this.drone.position.y = groundLevel;
            this.velocity.y = Math.max(this.velocity.y, 0);
            this.velocity.x *= 0.5;
            this.velocity.z *= 0.5;
            this.drone.rotation.x = THREE.MathUtils.lerp(
              this.drone.rotation.x,
              0,
              Math.min(15 * dt, 1),
            );
            this.drone.rotation.z = THREE.MathUtils.lerp(
              this.drone.rotation.z,
              0,
              Math.min(15 * dt, 1),
            );
          }

          // Cybernetic screen vibration/shake on heavy glitching
          if (this.synth && this.synth.glitchFactor > 0.1) {
            const gf = this.synth.glitchFactor;
            const shake = (Math.random() - 0.5) * 0.012 * gf;
            this.panel.position.x += shake;
            this.panel.position.y += shake;
            this.scannerPanel.position.x += shake;
            this.scannerPanel.position.y += shake;
          }

          if (this.altText && this.speedText) {
            this.altText.setText(`ALT ${altitude.toFixed(2)}m`);
            this.speedText.setText(`SPD ${horizontalSpeed.toFixed(2)}m/s`);

            const sysStatus =
              this.systemIntegrity < 100
                ? `REPAIRING: ${Math.floor(this.systemIntegrity)}%`
                : `SYS: NOMINAL`;
            this.bpmText.setText(
              `BPM: ${Math.round(this.currentBPM)} | ${sysStatus}`,
            );
          }
          if (this.lGestText && this.rGestText) {
            this.lGestText.setText(`L-HAND: ${this.gestureL}`);
            this.rGestText.setText(`R-HAND: ${this.gestureR}`);
          }

          if (this.visCtx && this.frameCount % 2 === 0) {
            this.visCtx.fillStyle = "#050a08";
            this.visCtx.fillRect(
              0,
              0,
              this.visCanvas.width,
              this.visCanvas.height,
            );

            if (this.pcaEnabled) {
              const sweepY = (this.time * 200) % this.visCanvas.height;
              this.visCtx.fillStyle = "rgba(0, 255, 163, 0.08)";
              this.visCtx.fillRect(0, 0, this.visCanvas.width, sweepY);
              this.visCtx.strokeStyle = "rgba(0, 255, 163, 0.4)";
              this.visCtx.lineWidth = 1;
              this.visCtx.beginPath();
              this.visCtx.moveTo(0, sweepY);
              this.visCtx.lineTo(this.visCanvas.width, sweepY);
              this.visCtx.stroke();
              this.visCtx.fillStyle = "#00ffa3";
              this.visCtx.font = "bold 24px Courier New";
              this.visCtx.fillText("● PCA CAMERA FEED ACTIVE", 20, 35);
            } else if (this.audioStarted && this.synth.analyser) {
              this.synth.analyser.getByteFrequencyData(this.synth.dataArray);
              const barWidth =
                this.visCanvas.width / this.synth.analyser.frequencyBinCount;
              for (
                let i = 0, x = 0;
                i < this.synth.analyser.frequencyBinCount;
                i++, x += barWidth
              ) {
                const barHeight =
                  (this.synth.dataArray[i] / 255) *
                  this.visCanvas.height *
                  0.85;
                this.visCtx.fillStyle = "#ff4a00";
                this.visCtx.fillRect(
                  x,
                  this.visCanvas.height - barHeight,
                  barWidth - 2,
                  barHeight,
                );
              }
            }
            this.visTexture.needsUpdate = true;
          }
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const options = new xb.Options();
        options.enableUI();
        options.enableXRTransitions();
        options.enableHands();
        options.hands.enabled = true;
        options.hands.visualization = true;
        options.controllers.visualizeRays = true;
        options.enableCamera();

        options.depth = new xb.DepthOptions(xb.xrDepthMeshPhysicsOptions);
        options.depth.depthMesh.colliderUpdateFps = 30;

        options.setAppTitle("Multiverse TE Drone MVP3");
        xb.add(new DroneSimulator());
        xb.init(options);
      });
    </script>
  </body>

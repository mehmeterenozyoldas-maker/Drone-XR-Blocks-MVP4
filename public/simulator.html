    <script type="module">
      import "xrblocks/addons/simulator/SimulatorAddons.js";
      import * as THREE from "three";
      import * as xb from "xrblocks";
      import { RainParticles } from "./RainParticles.js";
      import { VRWorldManager } from "./VRWorldManager.js";
      import { PaintSplash } from "./PaintSplash.js";
      import { palette } from "xrblocks/addons/utils/Palette.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      // Global unhandled rejection guard to gracefully catch redundant WebXR session initialization calls
      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason?.message || event.reason?.toString() || "";
        if (reason.includes("Session already started")) {
          event.preventDefault(); // Suppresses the unhandled promise rejection error overlay
          console.warn(
            "Safely caught and suppressed redundant WebXR session start event.",
          );
        }
      });

      const LEFT_HAND_INDEX = 0;
      const RIGHT_HAND_INDEX = 1;

      /**
       * Generative Flight-to-Techno Sequencer
       */
      class TechnoDroneSynth {
        constructor() {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();

          this.compressor = this.ctx.createDynamicsCompressor();
          this.compressor.threshold.value = -24;
          this.compressor.knee.value = 10;
          this.compressor.ratio.value = 12;
          this.compressor.attack.value = 0.003;
          this.compressor.release.value = 0.25;

          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 0.5;

          this.analyser = this.ctx.createAnalyser();
          this.analyser.fftSize = 128;
          this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);

          this.globalFilter = this.ctx.createBiquadFilter();
          this.globalFilter.type = "lowpass";
          this.globalFilter.frequency.value = 20000;

          this.panner = this.ctx.createPanner();
          this.panner.panningModel = "HRTF";
          this.panner.distanceModel = "inverse";
          this.panner.refDistance = 1;
          this.panner.maxDistance = 10000;
          this.panner.rolloffFactor = 1.2;

          this.masterGain.connect(this.compressor);
          this.compressor.connect(this.globalFilter);
          this.globalFilter.connect(this.analyser);
          this.analyser.connect(this.panner);
          this.panner.connect(this.ctx.destination);

          this.isPlaying = false;
          this.currentStep = 0;
          this.nextNoteTime = 0.0;
          this.lookahead = 25.0;
          this.scheduleAheadTime = 0.1;

          this.bpm = 110;
          this.filterCutoff = 400;
          this.hatDecay = 0.05;
          this.glitchFactor = 0.0;
          this.soundMode = "xr";

          this.bassScale = [65.41, 77.78, 87.31, 98.0, 116.54];
        }

        resume() {
          if (this.ctx.state === "suspended") {
            this.ctx
              .resume()
              .catch((e) => console.warn("Audio context resume blocked:", e));
          }
          if (!this.isPlaying) {
            this.isPlaying = true;
            this.nextNoteTime = this.ctx.currentTime + 0.05;
            this.scheduler();
          }
        }

        scheduler() {
          while (
            this.nextNoteTime <
            this.ctx.currentTime + this.scheduleAheadTime
          ) {
            this.scheduleNote(this.currentStep, this.nextNoteTime);
            this.nextNote();
          }
          if (this.isPlaying) {
            setTimeout(() => this.scheduler(), this.lookahead);
          }
        }

        nextNote() {
          const secondsPerBeat = 60.0 / this.bpm;
          this.nextNoteTime += 0.25 * secondsPerBeat;
          this.currentStep++;
          if (this.currentStep >= 16) this.currentStep = 0;
        }

        scheduleNote(stepNumber, time) {
          if (this.soundMode === "greek") {
            this.scheduleGreekNote(stepNumber, time);
          } else if (this.soundMode === "temple") {
            this.scheduleTempleNote(stepNumber, time);
          } else {
            // Original XR mode (Techno Drone)
            if (
              this.glitchFactor > 0.1 &&
              Math.random() < this.glitchFactor * 0.3
            ) {
              time += (Math.random() - 0.5) * 0.08;
            }

            if (stepNumber % 4 === 0) this.playKick(time);
            if (stepNumber % 4 === 2) this.playHat(time, this.hatDecay);

            if ([0, 3, 7, 10, 12, 14].includes(stepNumber)) {
              const noteFreq =
                this.bassScale[Math.floor(Math.random() * this.bassScale.length)];
              this.playAcidBass(time, noteFreq);
            }

            if (
              this.glitchFactor > 0.25 &&
              Math.random() < this.glitchFactor * 0.35
            ) {
              this.playGlitchNoise(time + 0.05);
            }
          }
        }

        scheduleGreekNote(stepNumber, time) {
          // Epic Dark-Ambient/Industrial Gothic Ritual Techno
          if (stepNumber % 4 === 0) {
            this.playHeavyDrum(time);
          } else if (stepNumber % 4 === 2 && Math.random() < 0.6) {
            this.playGreekMetalRattle(time);
          }

          // Slow ominous bassline drone
          if (stepNumber % 4 === 0) {
            const noteFreq = this.bassScale[Math.floor(Math.random() * this.bassScale.length)];
            this.playGreekBass(time, noteFreq);
          }

          // Random ambient eerie screaming metallic wind whispers
          if (stepNumber % 8 === 4 && Math.random() < 0.25) {
            this.playEerieScreech(time);
          }
        }

        scheduleTempleNote(stepNumber, time) {
          // Meditative crystalline bells, ambient warm chords, and subtle celestial pulses
          if (stepNumber % 8 === 0) {
            this.playWarmHeartbeat(time);
          }

          // Pentatonic chime clusters
          if ([0, 2, 4, 6, 8, 10, 12, 14].includes(stepNumber) && Math.random() < 0.65) {
            const pitches = [440.0, 493.88, 554.37, 659.25, 739.99, 880.0, 987.77, 1108.73];
            const pitch = pitches[Math.floor(Math.random() * pitches.length)];
            this.playTempleChime(time, pitch);
          }

          // Deep cosmic swell
          if (stepNumber === 0) {
            this.playCosmicSwell(time);
          }
        }

        playKick(time) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(150, time);
          osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
          gain.gain.setValueAtTime(1.0, time);
          gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + 0.5);
        }

        playHat(time, decay) {
          const bufferSize = this.ctx.sampleRate * decay;
          if (bufferSize <= 0) return;
          const buffer = this.ctx.createBuffer(
            1,
            bufferSize,
            this.ctx.sampleRate,
          );
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noiseSource = this.ctx.createBufferSource();
          noiseSource.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = "highpass";
          filter.frequency.value = 7000;
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.3, time);
          gain.gain.exponentialRampToValueAtTime(0.01, time + decay);
          noiseSource.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);
          noiseSource.start(time);
        }

        playAcidBass(time, freq) {
          const osc = this.ctx.createOscillator();
          osc.type = "sawtooth";
          const filter = this.ctx.createBiquadFilter();
          filter.type = "lowpass";
          filter.Q.value = 15;
          filter.frequency.setValueAtTime(this.filterCutoff * 2, time);
          filter.frequency.exponentialRampToValueAtTime(
            this.filterCutoff / 2,
            time + 0.2,
          );
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.3, time);
          gain.gain.linearRampToValueAtTime(0.01, time + 0.2);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);

          let targetFreq = freq;
          if (this.glitchFactor > 0.1) {
            targetFreq *= 0.82 + Math.random() * 0.36; // digital pitch drift/flutter
          }
          osc.frequency.setValueAtTime(targetFreq, time);

          osc.start(time);
          osc.stop(time + 0.2);
        }

        playGlitchNoise(time) {
          const osc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc.type = Math.random() > 0.5 ? "sawtooth" : "square";
          osc.frequency.setValueAtTime(400 + Math.random() * 3000, time);

          filter.type = "bandpass";
          filter.frequency.setValueAtTime(1200 + Math.random() * 4500, time);
          filter.Q.value = 25;

          gain.gain.setValueAtTime(0.12 * this.glitchFactor, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);

          osc.start(time);
          osc.stop(time + 0.05);
        }

        playHeavyDrum(time) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const waveShaper = this.ctx.createWaveShaper();
          
          const makeDistortionCurve = (amount = 20) => {
            const k = typeof amount === 'number' ? amount : 50;
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            const deg = Math.PI / 180;
            for (let i = 0 ; i < n_samples; ++i ) {
              const x = (i * 2) / n_samples - 1;
              curve[i] = ( 3 + k ) * x * 20 * deg / ( Math.PI + k * Math.abs(x) );
            }
            return curve;
          };
          waveShaper.curve = makeDistortionCurve(15);
          waveShaper.oversample = '4x';

          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(100, time);
          osc.frequency.exponentialRampToValueAtTime(30, time + 0.6);

          const lowpass = this.ctx.createBiquadFilter();
          lowpass.type = "lowpass";
          lowpass.frequency.setValueAtTime(250, time);
          lowpass.frequency.exponentialRampToValueAtTime(60, time + 0.4);
          lowpass.Q.value = 5;

          gain.gain.setValueAtTime(0.7, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.6);

          osc.connect(waveShaper);
          waveShaper.connect(lowpass);
          lowpass.connect(gain);
          gain.connect(this.masterGain);

          osc.start(time);
          osc.stop(time + 0.61);
        }

        playGreekMetalRattle(time) {
          const osc = this.ctx.createOscillator();
          const modulator = this.ctx.createOscillator();
          const modGain = this.ctx.createGain();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();

          modulator.type = "sawtooth";
          modulator.frequency.value = 350;
          modGain.gain.value = 800;

          osc.type = "triangle";
          osc.frequency.value = 1450;

          filter.type = "bandpass";
          filter.frequency.setValueAtTime(12000, time);
          filter.frequency.exponentialRampToValueAtTime(2000, time + 0.25);
          filter.Q.value = 8;

          gain.gain.setValueAtTime(0.18, time);
          gain.gain.exponentialRampToValueAtTime(0.005, time + 0.25);

          modulator.connect(modGain);
          modGain.connect(osc.frequency);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);

          modulator.start(time);
          osc.start(time);
          modulator.stop(time + 0.26);
          osc.stop(time + 0.26);
        }

        playGreekBass(time, freq) {
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc1.type = "sawtooth";
          osc1.frequency.setValueAtTime(freq, time);
          
          osc2.type = "square";
          osc2.frequency.setValueAtTime(freq * 0.5, time);

          filter.type = "lowpass";
          filter.Q.value = 10;
          filter.frequency.setValueAtTime(120, time);
          filter.frequency.exponentialRampToValueAtTime(450, time + 0.15);
          filter.frequency.exponentialRampToValueAtTime(80, time + 0.38);

          gain.gain.setValueAtTime(0.35, time);
          gain.gain.linearRampToValueAtTime(0.01, time + 0.4);

          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);

          osc1.start(time);
          osc2.start(time);
          osc1.stop(time + 0.41);
          osc2.stop(time + 0.41);
        }

        playEerieScreech(time) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(2000, time);
          osc.frequency.exponentialRampToValueAtTime(8000, time + 0.3);

          gain.gain.setValueAtTime(0.05, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);

          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(time);
          osc.stop(time + 0.3);
        }

        playWarmHeartbeat(time) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const lp = this.ctx.createBiquadFilter();

          lp.type = "lowpass";
          lp.frequency.value = 120;

          osc.type = "sine";
          osc.frequency.setValueAtTime(80, time);
          osc.frequency.exponentialRampToValueAtTime(25, time + 0.3);

          gain.gain.setValueAtTime(0.65, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.35);

          osc.connect(lp);
          lp.connect(gain);
          gain.connect(this.masterGain);

          osc.start(time);
          osc.stop(time + 0.36);
        }

        playTempleChime(time, freq) {
          const ratios = [1.0, 2.0, 3.01, 4.12, 5.25];
          const volumes = [0.22, 0.12, 0.08, 0.05, 0.02];
          const decays = [0.8, 0.5, 0.3, 0.15, 0.08];

          ratios.forEach((ratio, index) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const filter = this.ctx.createBiquadFilter();

            osc.type = "sine";
            osc.frequency.setValueAtTime(freq * ratio, time);

            filter.type = "highpass";
            filter.frequency.value = 200;

            const finalVol = volumes[index] * 0.45;
            const finalDecay = decays[index] * 1.5;

            gain.gain.setValueAtTime(0, time);
            gain.gain.linearRampToValueAtTime(finalVol, time + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.001, time + finalDecay);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(this.masterGain);

            osc.start(time);
            osc.stop(time + finalDecay + 0.05);
          });
        }

        playCosmicSwell(time) {
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc1.type = "sawtooth";
          osc1.frequency.value = 110.0;
          osc2.type = "triangle";
          osc2.frequency.value = 110.5;

          filter.type = "lowpass";
          filter.Q.value = 4.0;
          filter.frequency.setValueAtTime(100, time);
          filter.frequency.exponentialRampToValueAtTime(1800, time + 1.2);
          filter.frequency.exponentialRampToValueAtTime(150, time + 2.5);

          gain.gain.setValueAtTime(0, time);
          gain.gain.linearRampToValueAtTime(0.18, time + 0.8);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 2.5);

          osc1.connect(filter);
          osc2.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterGain);

          osc1.start(time);
          osc2.start(time);
          osc1.stop(time + 2.6);
          osc2.stop(time + 2.6);
        }

        playLaser() {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.15);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.15);
        }

        playImpact() {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(100, now);
          osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
          gain.gain.setValueAtTime(0.8, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(now);
          osc.stop(now + 0.3);
        }

        playSuccess() {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "square";
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, now + i * 0.05);
            gain.gain.linearRampToValueAtTime(0.3, now + i * 0.05 + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.15);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(now + i * 0.05);
            osc.stop(now + i * 0.05 + 0.15);
          });
        }

        updateFlightParams(throttle, velocity, tiltX, tiltZ, yawAmount, dt) {
          const targetBpm = 110 + Math.abs(throttle) * 35;
          this.bpm += (targetBpm - this.bpm) * 0.05;
          const tiltMagnitude = Math.abs(tiltX) + Math.abs(tiltZ);
          this.filterCutoff = 200 + tiltMagnitude * 2000;
          this.hatDecay = 0.05 + Math.abs(yawAmount) * 0.15;

          if (dt) {
            this.glitchFactor = Math.max(0, this.glitchFactor - dt * 2.5); // decay glitch over time
          }
        }

        updateParams(altitude) {
          const targetFreq = Math.max(
            800,
            Math.min(20000, 20000 - altitude * 1000),
          );
          this.globalFilter.frequency.setTargetAtTime(
            targetFreq,
            this.ctx.currentTime,
            0.1,
          );
        }

        updateSpatialAudio(dronePos, cameraPos, cameraQuat) {
          if (!this.panner || !this.ctx || this.ctx.state !== "running") return;
          const time = this.ctx.currentTime + 0.05;
          this.panner.positionX.setTargetAtTime(dronePos.x, time, 0.1);
          this.panner.positionY.setTargetAtTime(dronePos.y, time, 0.1);
          this.panner.positionZ.setTargetAtTime(dronePos.z, time, 0.1);

          const listener = this.ctx.listener;
          if (listener.positionX) {
            listener.positionX.setTargetAtTime(cameraPos.x, time, 0.1);
            listener.positionY.setTargetAtTime(cameraPos.y, time, 0.1);
            listener.positionZ.setTargetAtTime(cameraPos.z, time, 0.1);

            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(
              cameraQuat,
            );
            const up = new THREE.Vector3(0, 1, 0).applyQuaternion(cameraQuat);

            listener.forwardX.setTargetAtTime(forward.x, time, 0.1);
            listener.forwardY.setTargetAtTime(forward.y, time, 0.1);
            listener.forwardZ.setTargetAtTime(forward.z, time, 0.1);

            listener.upX.setTargetAtTime(up.x, time, 0.1);
            listener.upY.setTargetAtTime(up.y, time, 0.1);
            listener.upZ.setTargetAtTime(up.z, time, 0.1);
          }
        }
      }

      class LiveCoPilot {
        constructor() {
          this.ws = null;
          this.inputAudioCtx = null;
          this.outputAudioCtx = null;
          this.stream = null;
          this.processor = null;
          this.source = null;
          this.isActive = false;
          this.nextStartTime = 0;
          this.onStatusChange = null;
          this.videoInterval = null;
          this.videoEl = null;
          this.canvasEl = null;
        }

        async connect() {
          if (this.isActive) return;
          this.isActive = true;
          this.hasCustomError = false;
          if (this.onStatusChange) this.onStatusChange("CONNECTING...");

          const protocol =
            window.location.protocol === "https:" ? "wss:" : "ws:";
          this.ws = new WebSocket(`${protocol}//${window.location.host}/live`);

          this.inputAudioCtx = new AudioContext({ sampleRate: 16000 });
          this.outputAudioCtx = new AudioContext({ sampleRate: 24000 });
          this.nextStartTime = 0;

          try {
            this.stream = await navigator.mediaDevices.getUserMedia({
              audio: { echoCancellation: true, noiseSuppression: true },
            });

            try {
              this.videoStream = await navigator.mediaDevices.getUserMedia({
                video: {
                  facingMode: "environment",
                  width: { ideal: 640 },
                  height: { ideal: 480 },
                },
              });
              this.videoEl = document.createElement("video");
              this.videoEl.srcObject = this.videoStream;
              this.videoEl.play();
              this.canvasEl = document.createElement("canvas");
              this.canvasEl.width = 640;
              this.canvasEl.height = 480;

              this.videoInterval = setInterval(() => {
                if (
                  this.ws &&
                  this.ws.readyState === WebSocket.OPEN &&
                  this.videoEl.readyState >= 2
                ) {
                  const ctx = this.canvasEl.getContext("2d");
                  ctx.drawImage(this.videoEl, 0, 0, 640, 480);
                  const base64 = this.canvasEl.toDataURL("image/jpeg", 0.6);
                  this.ws.send(JSON.stringify({ image: base64 }));
                }
              }, 1000); // 1 FPS
            } catch (videoErr) {
              console.warn(
                "Video copilot disabled (no camera or denied):",
                videoErr,
              );
            }

            this.source = this.inputAudioCtx.createMediaStreamSource(
              this.stream,
            );
            this.processor = this.inputAudioCtx.createScriptProcessor(
              4096,
              1,
              1,
            );
            this.source.connect(this.processor);
            this.processor.connect(this.inputAudioCtx.destination);

            this.processor.onaudioprocess = (e) => {
              if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                const pcmData = e.inputBuffer.getChannelData(0);
                let buffer = new ArrayBuffer(pcmData.length * 2);
                let view = new DataView(buffer);
                for (let i = 0; i < pcmData.length; i++) {
                  let s = Math.max(-1, Math.min(1, pcmData[i]));
                  view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
                }
                let binary = "";
                let bytes = new Uint8Array(buffer);
                for (let i = 0; i < bytes.byteLength; i++) {
                  binary += String.fromCharCode(bytes[i]);
                }
                this.ws.send(JSON.stringify({ audio: btoa(binary) }));
              }
            };

            this.ws.onopen = () => {
              if (this.onStatusChange)
                this.onStatusChange("LIVE API CONNECTED");
            };

            this.ws.onclose = () => {
              if (this.onStatusChange && this.isActive) {
                if (!this.hasCustomError) {
                  this.onStatusChange("CONNECTION LOST");
                }
              }
              this.disconnect();
            };

            this.ws.onmessage = (event) => {
              const msg = JSON.parse(event.data);
              if (msg.error) {
                this.hasCustomError = true;
                if (this.onStatusChange) this.onStatusChange(msg.error);
              }
              if (msg.audio) this.playAudioChunk(msg.audio);
              if (msg.interrupted) this.nextStartTime = 0;
            };
          } catch (err) {
            console.error("CoPilot Mic error:", err);
            if (this.onStatusChange) this.onStatusChange("MIC ACCESS FAILED");
            this.disconnect();
          }
        }

        playAudioChunk(base64) {
          if (!this.outputAudioCtx) return;
          let binary;
          try {
            binary = atob(base64);
          } catch (e) {
            return;
          }
          const len = binary.length / 2;
          const buffer = this.outputAudioCtx.createBuffer(1, len, 24000);
          const channelData = buffer.getChannelData(0);

          let offset = 0;
          for (let i = 0; i < len; i++) {
            let low = binary.charCodeAt(offset);
            let high = binary.charCodeAt(offset + 1);
            let sample = (high << 8) | low;
            if (sample > 32767) sample -= 65536;
            channelData[i] = sample / 32768.0;
            offset += 2;
          }

          const source = this.outputAudioCtx.createBufferSource();
          source.buffer = buffer;
          source.connect(this.outputAudioCtx.destination);

          const now = this.outputAudioCtx.currentTime;
          if (this.nextStartTime < now) this.nextStartTime = now;

          source.start(this.nextStartTime);
          this.nextStartTime += buffer.duration;
        }

        disconnect() {
          this.isActive = false;
          if (this.videoInterval) {
            clearInterval(this.videoInterval);
            this.videoInterval = null;
          }
          if (this.onStatusChange) this.onStatusChange("AI CO-PILOT OFFLINE");
          if (this.ws) {
            this.ws.close();
            this.ws = null;
          }
          if (this.processor) {
            this.processor.disconnect();
            this.processor = null;
          }
          if (this.source) {
            this.source.disconnect();
            this.source = null;
          }
          if (this.videoStream) {
            this.videoStream.getTracks().forEach((t) => t.stop());
            this.videoStream = null;
          }
          if (this.stream) {
            this.stream.getTracks().forEach((t) => t.stop());
            this.stream = null;
          }
          if (this.inputAudioCtx) {
            this.inputAudioCtx.close();
            this.inputAudioCtx = null;
          }
          if (this.outputAudioCtx) {
            this.outputAudioCtx.close();
            this.outputAudioCtx = null;
          }
          this.videoEl = null;
          this.canvasEl = null;
        }
      }

        async captureCameraFrame() {
          return new Promise(async (resolve) => {
            try {
              // Tap into the device's environment-facing camera
              const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
              });
              const video = document.createElement("video");
              video.srcObject = stream;
              video.setAttribute("playsinline", "");
              video.play();

              video.onloadeddata = () => {
                // Capture the frame to an offscreen canvas
                const canvas = document.createElement("canvas");
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Extract base64 image data for the AI payload
                const base64 = canvas
                  .toDataURL("image/jpeg", 0.8)
                  .split(",")[1];

                // Cleanup hardware tracks
                stream.getTracks().forEach((track) => track.stop());
                resolve(base64);
              };

              // Failsafe timeout in case the XR session blocks hardware access
              setTimeout(() => resolve(null), 2500);
            } catch (err) {
              console.warn("Camera optical capture blocked or failed:", err);
              resolve(null); // Gracefully fallback to distance-based AI logic
            }
          });
        }

        async cycleCamera(offset) {
          if (!this.cameraStream) return;
          const devices = this.cameraStream.getAvailableDevices();
          if (devices.length <= 1) return;
          const newIndex =
            (this.cameraStream.getCurrentDeviceIndex() +
              offset +
              devices.length) %
            devices.length;
          await this.cameraStream.setDeviceId(devices[newIndex].deviceId);
          if (this.audioStarted)
            this.synth.playHat(this.synth.ctx.currentTime, 0.1);
        }

        resumeAudio() {
          if (!this.audioStarted) {
            if (this.synth) this.synth.resume();
            if (this.listener && this.listener.context.state === 'suspended') {
              this.listener.context.resume();
            }
            if (this.rainSound && this.rainSound.buffer && !this.rainSound.isPlaying) {
              this.rainSound.play();
            }
            this.audioStarted = true;
          }
        }

        setupXRHandshake() {
          if (xb.core.renderer && xb.core.renderer.xr) {
            xb.core.renderer.xr.addEventListener("sessionstart", () => {
              const session = xb.core.renderer.xr.getSession();
              if (session) {
                const startAudio = () => {
                  this.resumeAudio();
                };
                session.addEventListener("select", startAudio);
                session.addEventListener("selectstart", startAudio);

                session
                  .requestReferenceSpace("viewer")
                  .then((refSpace) => {
                    session
                      .requestHitTestSource({ space: refSpace })
                      .then((source) => {
                        this.hitTestSource = source;
                      })
                      .catch((err) =>
                        console.warn("Hit test source not available:", err),
                      );
                  })
                  .catch((err) =>
                    console.warn("Viewer space not available:", err),
                  );
              }
            });
          }
        }

        spawnExplosion(position, color) {
          let count = 0;
          const targetColor = color || new THREE.Color(0xff4100);
          for (let p of this.particlePool) {
            if (!p.active) {
              if (p.mesh.material) {
                p.mesh.material.color.copy(targetColor);
                if (p.mesh.material.emissive) {
                  p.mesh.material.emissive.copy(targetColor).multiplyScalar(0.4);
                }
              }
              p.mesh.position.copy(position);
              p.vel.set(
                (Math.random() - 0.5) * 5.0,
                (Math.random() - 0.2) * 5.0,
                (Math.random() - 0.5) * 5.0,
              );
              p.active = true;
              p.age = 0;
              p.mesh.visible = true;
              p.mesh.scale.set(1.4, 1.4, 1.4);
              count++;
              if (count >= 16) break;
            }
          }
        }

        spawnPropWash(altitude, groundLevel, dt) {
          if (altitude > 1.5) return;
          if (Math.random() > 0.35) return;

          const p = this.particlePool.find((item) => !item.active);
          if (p) {
            const angle = Math.random() * Math.PI * 2;
            const r = 0.05 + Math.random() * 0.15;
            p.mesh.position.set(
              this.drone.position.x + Math.cos(angle) * r,
              groundLevel + 0.01,
              this.drone.position.z + Math.sin(angle) * r,
            );

            const power = (1.5 - altitude) * 4.0;
            p.vel.set(
              Math.cos(angle) * power,
              0.05 + Math.random() * 0.1,
              Math.sin(angle) * power,
            );

            p.active = true;
            p.age = 0;
            p.mesh.visible = true;
            p.mesh.scale.set(0.35, 0.35, 0.35); // Tiny dust particles
          }

              (Math.random() - 0.5) * 6,

        setMode(mode) {
          if (!xb.core.transition) return;
          this.currentMode = mode;
          if (mode === "AR") {
            xb.core.transition.toAR();
            this.envGrid.visible = false;
            if (xb.core.scene) {
              xb.core.scene.background = null;
              xb.core.scene.fog = null;
            }
          } else if (mode === "VR") {
            xb.core.transition.toVR({ color: 0x111111 });
            this.envGrid.visible = true;
            if (xb.core.scene) {
              xb.core.scene.background = new THREE.Color(0x111111);
            }
          }
        }

        togglePCAFeed() {
          this.pcaEnabled = !this.pcaEnabled;
          if (this.audioStarted) this.synth.playSuccess();
        }

        toggleHUD() {
          this.panel.visible = !this.panel.visible;
          this.scannerPanel.visible = !this.scannerPanel.visible;
          if (this.audioStarted)
            this.synth.playHat(this.synth.ctx.currentTime, 0.1);
        }

        toggleFlightMode() {
          this.flightMode = this.flightMode === "RC" ? "KINETIC" : "RC";
          this.scanStatusText.setText(`MODE: ${this.flightMode}`);
          if (this.audioStarted) this.synth.playSuccess();
        }

        toggleCoPilot() {
          if (this.copilot.isActive) {
            this.copilot.disconnect();
          } else {
            this.copilot.connect();
          }
          if (this.audioStarted) this.synth.playSuccess();
        }

        recallDrone() {
          if (xb.core.camera && this.drone) {
            const forward = new THREE.Vector3(0, 0, -1.5).applyQuaternion(
              xb.core.camera.quaternion,
            );
            this.drone.position.copy(xb.core.camera.position).add(forward);
            this.velocity.set(0, 0, 0);
            this.smoothedInputs = { throttle: 0, yaw: 0, pitch: 0, roll: 0 };

            if (this.audioStarted) this.synth.playSuccess();
            this.triggerHaptic(1.0, 50);
          }
        }

            const mZ = pos.z * 0.16;

            const rod1 = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.003, rodLength, 8).rotateX(Math.PI / 2), matDark);

            guardRing.rotation.x = Math.PI / 2;
            guardRing.position.set(mX, 0.022, mZ);
            frameLower.add(guardRing);

            for (let a = 0; a < 4; a++) {

              const braceGeo = new THREE.CylinderGeometry(0.002, 0.002, 0.09, 6).rotateZ(Math.PI / 2);

              brace.position.set(

                0.015,

              );
              brace.rotation.y = -angle;
              frameLower.add(brace);
            }

            // Rotor assembly (Propellers with high-density physical layout)
            const rotorGroup = new THREE.Group();
            rotorGroup.position.set(0, 0.025, 0);
            motorCasing.add(rotorGroup);

            const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.01, 12), matSilver);
            rotorGroup.add(hub);

            // Brass center lock bolt nut/fastener
            const lockBolt = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.0045, 0.004, 6), matBrass);
            lockBolt.position.y = 0.006;

            const propGeo = new THREE.CylinderGeometry(0.082, 0.082, 0.001, 32);

            // Silver counterbalance pins on roots

            weightL.position.set(-0.012, 0.001, 0);

            const weightR = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.003, 0.003, 8), matSilver);
            weightR.position.set(0.012, 0.001, 0);
            bladeGroup.add(weightR);

            // Colorful TE high-speed tips for visual orientation (Orange for front, White for back)
            const tipColorMat = pos.z > 0 ? matTEOrange : matTEWhite;
            const tipL = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.0022, 0.012), tipColorMat);
            tipL.position.set(-0.075, 0.0001, 0);

            const tipR = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.0022, 0.012), tipColorMat);
            tipR.position.set(0.075, 0.0001, 0);
            bladeGroup.add(tipR);

            rotorGroup.userData.spinDir = pos.spinDir;
            this.rotors.push(rotorGroup);
          });

          // 10. FRONT DUAL-AXIS CAMERA GIMBAL & SHOCK-ABSORBER SUSPENSION
          // Rubber anti-vibration shock dampers
          const damperGroup = new THREE.Group();
          damperGroup.position.set(0, 0, -0.14);

          for (let d = 0; d < 4; d++) {
